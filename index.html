<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<meta name="description" content="Software engineer portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header class="site-header">
    <span class="logo" id="logo">—</span>
    <nav class="nav">
      <a href="#work">work</a>
      <a href="#about">about</a>
      <a href="#contact">contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="top">
      <p class="prompt-line"><span class="prompt-symbol">$</span> <span id="typed"></span><span class="cursor" id="cursor">▌</span></p>
      <h1 id="hero-name">Your Name</h1>
      <p class="hero-tagline" id="hero-tagline">Loading…</p>
      <p class="hero-status" id="hero-status"></p>
    </section>

    <section class="section" id="work">
      <div class="section-head">
        <h2>Experiences</h2>
      </div>
      <div class="project-list" id="project-list"><!-- injected by script.js --></div>
    </section>

    <section class="section" id="about">
      <div class="section-head">
        <h2>About</h2>
      </div>
      <p class="about-text" id="about-text">Loading…</p>
    </section>

    <section class="section" id="contact">
      <div class="section-head">
        <h2>Contact</h2>
      </div>
      <ul class="contact-list" id="contact-list"><!-- injected by script.js --></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>Built with plain HTML/CSS/JS. <a href="https://github.com" target="_blank" rel="noopener">Edit on GitHub →</a></p>
  </footer>

</div>

<script src="config.js"></script>
<script src="projects.js"></script>
<script src="script.js"></script>
</body>
</html>
